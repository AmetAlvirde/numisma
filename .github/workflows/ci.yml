name: CI

# Free for this repo: numisma is public, so GitHub Actions minutes are unlimited,
# and the Postgres below is a service container on the runner (no external DB, no
# spend). Delete this file to discard CI entirely.
#
# This is what makes the PRD #121 reliability bar real: the ADR-007 credential
# invariants (reader can't write, writer can't delete) and push upsert idempotency
# run against a REAL Postgres here, so a provisioning regression fails the build,
# not production.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Points the gated DB-integration tests (pg-substrate.testkit.ts) at the
      # service container. The default `postgres` role is a superuser, so the
      # throwaway-DB substrate can CREATE DATABASE / CREATE ROLE as it needs.
      # Absent this, those tests skip loudly; here they RUN.
      NUMISMA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Apply vendored auth schema (ADR-010 — guards the committed SQL)
        # Runs the documented first-time auth step against the service Postgres.
        # It fails if src/auth/better-auth.schema.sql is missing (the regression
        # that shipped once: the file was git-ignored), and the second run proves
        # the apply is idempotent (already-exists → no-op). AUTH_DATABASE_URL
        # points at the `postgres` DB; the throwaway-DB integration tests below
        # create their own databases, so the auth tables here don't collide.
        env:
          AUTH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm --filter @numisma/web auth:apply
          pnpm --filter @numisma/web auth:apply

      - name: Build web app (ADR-007 — produces the client bundle to inspect)
        # The client-bundle invariant test below is substrate-gated on a built
        # `.vercel/output/static`; building here makes it RUN (it skips loudly on
        # an unbuilt tree). A vite build is also a real check the app compiles.
        run: pnpm --filter @numisma/web build

      - name: Test (unit + DB-backed ADR-007 invariants, push idempotency, client-bundle guard)
        # ⚠️ THE PRICE-FEED WRAPPER HARNESS DOES NOT RUN HERE, AND A GREEN CHECK ON THIS
        # STEP DOES NOT MEAN IT PASSED — IT MEANS IT WAS NOT ATTEMPTED.
        # `apps/price-feed/src/wrapper-harness/` drives ops/price-feed/run-daily-fetch.sh
        # as a real process. It targets macOS /bin/bash 3.2.57, BSD ps/pgrep and a
        # watchdog hand-rolled *because* macOS ships no timeout(1), so it cannot run on
        # this ubuntu-latest runner. Its platform gate skips it here and SAYS SO in the
        # test output (one always-running test prints the decision either way). The
        # harness runs on a macOS machine, automatically when its own subject code
        # changes, or on demand via `pnpm test:wrapper`. See docs/price-feed-ops.md.
        #
        # NO --testTimeout FLAG HERE ANY MORE. The 30 s budget this step used to
        # pass on the command line now lives in `vitest.config.ts`, where it
        # applies to local runs too. Passing it here as well would restore the
        # divergence it was moved to end: while the flag was CI-only, a local run
        # was STRICTER than CI, so a loaded machine could red on a case CI would
        # never fail. The config states the budget; this step just runs the suite.
        run: pnpm test

      # ---------------------------------------------------------------------
      # The startup smoke (#196). Closes the hole that produced #140: the
      # smoke's fixture went stale against the event schema, `parseEvent`
      # refused the `PositionOpened`, `pnpm smoke:startup` exited 1 — and every
      # check above stayed green, because nothing here ran it. It was caught by
      # hand. These two steps are the CI half of that gate.
      #
      # A BARE `smoke:startup` STEP, not `pnpm verify`. `verify` is
      # `typecheck && test && smoke:startup`, and the first two already ran as
      # their own steps above; a `verify` step would run both a second time and
      # collapse three distinct failures into one red step. The operator's
      # one-command path (#195) is unaffected — this is CI's decomposition of
      # the same chain, not a competing one.
      #
      # GATED TO PRs TARGETING `main`. `on:` above is `push: ["**"]` plus
      # `pull_request`, so an ungated step would boot the renderer on every push
      # to every branch. The gate lives on the steps rather than on `on:` so no
      # existing coverage is withdrawn: pushes still run typecheck, build and
      # the full suite exactly as before.
      # ---------------------------------------------------------------------
      - name: Install Bun (the startup smoke runs on Bun, not Node)
        # `smoke:startup` is `bun apps/tui/src/smoke-startup-openTui.ts` —
        # openTUI needs Bun, which is why this is a Bun script and not a vitest
        # test. Pinned like pnpm and Node above rather than floating on latest.
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: "Startup smoke (real openTUI render path — the #140 gate)"
        # Drives `prepareStartup` (ingest → report → fold) through `mountApp` on
        # openTUI's TEST renderer against a throwaway on-disk event store in a
        # temp dir — no TTY required, and it never reads the real data dir.
        #
        # The name is QUOTED because it contains a `#`: unquoted, YAML would read
        # that as a comment and silently truncate the name mid-word.
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: pnpm smoke:startup

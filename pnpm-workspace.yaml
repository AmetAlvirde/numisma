packages:
  - packages/*
  - apps/*

allowBuilds:
  # better-auth pulls these as OPTIONAL adapter deps; @numisma/web uses the pg
  # (node-postgres) adapter only, so neither native build is needed.
  '@prisma/client': false
  better-sqlite3: false
  esbuild: true

# Force the patched esbuild across the tree (transitive via vite/vitest + tsx).
# Closes GHSA-g7r4-m6w7-qqqr (dev-only, Windows dev-server file read); < 0.28.1
# is vulnerable. Patch bump satisfies vite@7's and tsx@4's esbuild ranges.
overrides:
  esbuild: ">=0.28.1"
